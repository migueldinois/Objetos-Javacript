<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Aceitando caracteres utilizados na lingua portuguesa -->
    <meta charset="UTF-8">
    <!-- Responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="keywords" content="Gerador de senhas">

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/style/app-pwd-styles.css">

    <!-- Atributo defer para imporar o js depois do dom carregar -->
    <script src="./assets/js/app-pwd-logic.js" defer></script>

    <!-- Titulo do site -->
    <title>Gerador de Senhas - SENAI-SP</title>
</head>
<main class="app-pwd">
    <!-- Cabeçalho dinamico que exibe data e hora e a mensagem de saudacao -->
    <header class="app-pwd__header">
        <span class="app-pwd__datetime"></span>
        <span class="app-pwd__welcome"></span>
    </header>
    <!-- Seção principal que contem todos os elementos interativos do app gerador de senhas -->
    <section class="app-pwd__main">

        <img src="./assets/img/logo-senai-sp.png" alt="Logo SENAI SP" class="app-pwd__logo"></img>
        <!-- Container de entrada que agrupa o controle deslizante e opcoes de senha -->
        <div class="app-pwd__input">
            <!-- Exibicao do tamanho selecionado da senha -->
            <span class="app-pwd__text">Gerador de Senhas: <span class="app-pwd__size"></span> Caracteres</span>
            <!-- Controle deslizante para selecionar o tamnao da senha -->
            <input type="range" class="app-pwd__slider" min="8" max="16" value="8">

            <!-- Grupo de opcoes para personalizacao da senha -->
            <div class="app-pwd__options">
                <label class="app-pwd__option" name="uppercase-label">
                    <input type="checkbox" class="app-pwd__checkbox uppercase-check" name="uppercase" checked>
                    Letras maiúsculas (A-Z)
                </label>

                <label class="app-pwd__option" name="lowercase-label">
                    <input type="checkbox" class="app-pwd__checkbox lowercase-check" name="lowercase" checked>
                    Letras minúsculas (A-Z)
                </label>
                <label class="app-pwd__option" name="numbers-label">
                    <input type="checkbox" class="app-pwd__checkbox numbers-check" name="numbers" checked>
                    Numeros (0-9)
                </label>
                <label class="app-pwd__option" name="special-label">
                    <input type="checkbox" class="app-pwd__checkbox special-check" name="special" checked>
                    Caracteres especiais (!@#$%&*)
                </label>
            </div>
            <div class="app-pwd__button-container">
                <button class="app-pwd__button">Gerar nova senha</button>
                <button class="app-pwd__button app-pwd__button--clear">Limpar</button>
            </div>
        </div>
        <!-- Container que exibe a senha gerada e permite cópia -->
        <div class="app-pwd__result hide">
            <span class="app-pwd__title">Sua nova senha foi gerada!</span>
            <span class="app-pwd__output"></span>
            <span class="app-pwd__tooltip">Clique na senha para copiar. 👆</span>
        </div>
        <!-- Container que mantém o histórico das ultimas senhas geradas -->
        <div class="app-pwd__history">
            <h2 class="app-pwd__history-title">Ultima senhas geradas:</h2>
            <ul class="app-pwd__history-list"></ul>
        </div>
    </section>
</main>

<body>

</body>

</html>
