<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Virtual - Tamagotchi</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./script.js"></script>
</head>
<body class="tamagotchi">
    <header class="tamagotchi__header">
        <h1 class="tamagotchi__title">🐾 Meu Pet Virtual</h1>
    </header>

    <main class="tamagotchi__main">
        <section class="tamagotchi__display display">
            <div class="display__image">🐱</div>
            <h2 class="display__nome">Nome do Pet</h2>
            
            <div class="display__status">
                <p>Fome: <span id="valor-fome">50</span>%</p>
                <div class="barra"><div id="barra-fome" style="width: 50%;"></div></div>
                
                <p>Felicidade: <span id="valor-felicidade">50</span>%</p>
                <div class="barra"><div id="barra-felicidade" style="width: 50%;"></div></div>
            </div>
        </section>

        <section class="tamagotchi__acoes acoes">
            <button class="acoes__button" id="btn-alimentar">🥛 Alimentar</button>
            <button class="acoes__button" id="btn-brincar">🧶 Brincar</button>
            <button class="acoes__button" id="btn-status">Status</button>
        </section>

        <section class="tamagotchi__mensagem">
            <p id="mensagem-pet"></p>
        </section>
    </main>

    <footer class="tamagotchi__footer">
        <p>Objetos em JavaScript</p>
    </footer>
</body>
</html>
